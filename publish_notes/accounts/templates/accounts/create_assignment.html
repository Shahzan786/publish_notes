<!DOCTYPE html>
<html>

<head>
    <title>Create Assignment</title>
</head>

<body>

    <h1>Create Assignment</h1>

    <p>
        Class: {{ class_obj.name }}
    </p>

    <p>
        School: {{ class_obj.school.name }}
    </p>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Create Assignment
        </button>

    </form>

    <br>

    <a href="{% url 'teacher_dashboard' %}">
        Back to Dashboard
    </a>

</body>

</html>
