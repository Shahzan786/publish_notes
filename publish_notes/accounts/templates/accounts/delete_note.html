<!DOCTYPE html>
<html>
<head>
    <title>Delete Note</title>
</head>

<body>

    <h1>Delete Note</h1>

    <p>
        Are you sure you want to delete:
    </p>

    <h2>{{ note.title }}</h2>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete
        </button>

    </form>

    <br>

    <a href="{% url 'teacher_dashboard' %}">
        Cancel
    </a>

</body>
</html>
