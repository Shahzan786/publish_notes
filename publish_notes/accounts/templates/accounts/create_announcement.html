<!DOCTYPE html>
<html>

<head>
    <title>Create Announcement</title>
</head>

<body>

    <h1>Create Announcement</h1>

    <p>
        Class: {{ class_obj.name }}
    </p>

    <p>
        School: {{ class_obj.school.name }}
    </p>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Publish Announcement
        </button>

    </form>

    <br>

    <a href="{% url 'teacher_dashboard' %}">
        Back to Dashboard
    </a>

</body>

</html>
