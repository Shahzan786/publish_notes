<!DOCTYPE html>
<html>
<head>
    <title>Edit Note</title>
</head>

<body>

    <h1>Edit Note</h1>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Save Changes
        </button>

    </form>

    <br>

    <a href="{% url 'teacher_dashboard' %}">
        Cancel
    </a>

</body>
</html>
